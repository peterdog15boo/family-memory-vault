# Catch compile/type/lint failures before Vercel deploys.
# Mirrors `npm run build` on the production host (Next.js lint + typecheck + build).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          # Placeholders for any build-time env reads; real secrets stay in Vercel.
          NEXT_PUBLIC_APP_URL: https://ci.github-actions.local
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
          R2_BUCKET_NAME: ci
          R2_ACCOUNT_ID: "00000000000000000000000000000000"
          WORKER_SECRET: ci-worker-secret-not-used-in-build
